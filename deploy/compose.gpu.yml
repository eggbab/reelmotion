# NVIDIA 그래픽 카드로 받아쓰기. GTX 10 시리즈(Pascal)도 되도록 PyTorch 2.14.1 + CUDA 12.6 판을 쓴다.
# GTX 1070 Ti(메모리 8GB, bfloat16 미지원): 받아쓰기 모델은 그래픽 카드에 float32 로, 정렬 모델은 CPU 에 bfloat16 으로.
services:
  asr:
    build:
      args:
        TORCH_VARIANT: cu126
    environment:
      ASR_DEVICE: cuda:0
      ASR_ALIGNER_DEVICE: cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 말로 고치기 AI 도 그래픽 카드로(모든 층을 카드에). 4B Q4 약 2.5GB + 문맥 — 받아쓰기 모델과 함께 8GB 안에 든다(실제 카드에서는 아직 안 재 봤다).
  assist:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["--hf-repo", "unsloth/Qwen3-4B-Instruct-2507-GGUF", "--hf-file", "Qwen3-4B-Instruct-2507-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096", "--jinja", "--parallel", "1", "--n-gpu-layers", "99"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
