# ReelMotion 을 한 번에 띄운다: 웹(Caddy) + 받아쓰기 서버(Qwen3-ASR).
#   cd deploy && docker compose up -d --build                         # 그래픽 카드 없이
#   cd deploy && docker compose -f compose.yml -f compose.gpu.yml up -d --build   # GTX 1070 Ti 등 NVIDIA 카드로
name: reelmotion

services:
  web:
    build:
      context: ..
      target: web
      args:
        # 사이트 주소(https://도메인). 정하기 전에는 비워 둔다 — scripts/prerender.mjs
        SITE_ORIGIN: ${SITE_ORIGIN:-}
    image: reelmotion-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      ASR_UPSTREAM: asr:8008
      APP_UPSTREAM: app:8787
    depends_on:
      - asr
      - app
    restart: unless-stopped
    logging: &logging
      # 오류 기록만 남고(접속 기록 없음, IP 지움 — deploy/Caddyfile) 크기도 묶어 둔다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 로그인·계정·작업 저장(server/app). 저장소는 app-data 볼륨의 SQLite 파일 하나 — 백업은 docs/operations.md.
  # 비밀값(GOOGLE_CLIENT_SECRET)은 deploy/.env 에만 둔다(git 에 넣지 않는다).
  app:
    build:
      context: ..
      target: app
    image: reelmotion-app
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ASSIST_URL: http://assist:8080
      # 요금제 한도(영상 길이·한 달 횟수·무료 워터마크). 베타 동안은 0, 카드 결제를 붙이는 날 1 로(docs/operations.md 「결제 붙이기」).
      ENFORCE_PLANS: ${ENFORCE_PLANS:-0}
    volumes:
      - app-data:/data
    restart: unless-stopped
    logging: *logging

  # 말로 고치기 AI(server/app/assist.ts 가 부른다): llama.cpp 서버 + Qwen3-4B-Instruct-2507(Apache-2.0, Q4_K_M 약 2.5GB).
  # 처음 띄울 때 모델을 assist-models 볼륨에 내려받는다(몇 분). 영상·소리는 받지 않고 글만 받으며 저장하지 않는다.
  # 판을 고정했다(2026-11-15 이 판으로 시험). 올릴 때는 server/app/assist.live.test.ts 를 다시 돌린다.
  assist:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:89fe93c2ef53ea2d09ca9f53db8878a8f57bb6b143eb63c76a9c218fb583b392
    command: ["--hf-repo", "unsloth/Qwen3-4B-Instruct-2507-GGUF", "--hf-file", "Qwen3-4B-Instruct-2507-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096", "--jinja", "--parallel", "1"]
    environment:
      LLAMA_CACHE: /models
    volumes:
      - assist-models:/models
    mem_limit: 6g
    restart: unless-stopped
    logging: *logging

  asr:
    build:
      context: ../server/asr
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    image: reelmotion-asr
    environment:
      ASR_DEVICE: auto
      ASR_MAX_SECONDS: "600"
      ASR_MAX_WAITING: "4"
    volumes:
      - asr-models:/models
    # CPU 에서는 bfloat16 이 기본이라 약 1GB 를 쓴다(float32 로 바꾸면 약 7.3GB — engine.py 의 pick_dtype).
    mem_limit: 4g
    restart: unless-stopped
    logging: *logging

volumes:
  asr-models:
  app-data:
  assist-models:
